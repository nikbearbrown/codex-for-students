<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Path A versus Path B</title>
  <desc id="desc">Two horizontal flow timelines comparing two approaches to the same build. Path A specifies first and arrives at a working tool in a single short flow. Path B starts coding first and loops through rework before stopping unused. Both consume the same total time; only Path B is wasted.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C8102E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>

  <text x="32" y="56" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">FIGURE 8.2 — PATH A VS. PATH B</text>
  <text x="32" y="88" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Same Codex, same task. The framing decides the hour.</text>

  <!-- Path A — Specify first -->
  <text x="32" y="138" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#C8102E" font-weight="bold">PATH A — SPECIFY FIRST</text>
  <text x="32" y="152" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">10 min upstream → 45 min build → working tool</text>

  <!-- Path A timeline boxes -->
  <rect x="32" y="170" width="100" height="44" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="42" y="186" font-family="'IBM Plex Mono', 'Courier News', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">ASK MODE</text>
  <text x="42" y="200" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">interrogate</text>
  <text x="42" y="212" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#545454">10 min</text>

  <line x1="132" y1="192" x2="158" y2="192" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="160" y="170" width="100" height="44" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="170" y="186" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">SPEC</text>
  <text x="170" y="200" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">write</text>
  <text x="170" y="212" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#545454">5 min</text>

  <line x1="260" y1="192" x2="286" y2="192" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="288" y="170" width="120" height="44" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="298" y="186" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">CODE MODE</text>
  <text x="298" y="200" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">implement to spec</text>
  <text x="298" y="212" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#545454">45 min</text>

  <line x1="408" y1="192" x2="434" y2="192" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="436" y="170" width="100" height="44" fill="#F5EFE8" stroke="#C8102E" stroke-width="1"/>
  <text x="446" y="186" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#C8102E" font-weight="bold">WORKING</text>
  <text x="446" y="200" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-weight="bold" fill="#C8102E">used daily</text>
  <text x="446" y="212" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#545454">total: 60 min</text>

  <!-- Path B — Code first -->
  <text x="32" y="278" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454" font-weight="bold">PATH B — CODE FIRST, FIX LATER</text>
  <text x="32" y="292" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">60 min build → unused script → wasted hour</text>

  <rect x="32" y="310" width="120" height="44" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="42" y="326" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">CODE MODE</text>
  <text x="42" y="340" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">vague prompt</text>
  <text x="42" y="352" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#545454">25 min</text>

  <line x1="152" y1="332" x2="178" y2="332" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="180" y="310" width="100" height="44" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="190" y="326" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">REWORK 1</text>
  <text x="190" y="340" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">discard, retry</text>
  <text x="190" y="352" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#545454">15 min</text>

  <line x1="280" y1="332" x2="306" y2="332" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="308" y="310" width="100" height="44" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="318" y="326" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">REWORK 2</text>
  <text x="318" y="340" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">patch forward</text>
  <text x="318" y="352" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#545454">20 min</text>

  <line x1="408" y1="332" x2="434" y2="332" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="436" y="310" width="100" height="44" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="446" y="326" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">UNUSED</text>
  <text x="446" y="340" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">wrong framing</text>
  <text x="446" y="352" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#545454">total: 60 min</text>

  <!-- Rework loop curves -->
  <path d="M 230 310 C 230 260, 100 260, 92 308" fill="none" stroke="#C8102E" stroke-width="1" marker-end="url(#arrow-red)" stroke-dasharray="3 2"/>
  <text x="160" y="270" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#C8102E">re-prompt; same vague frame</text>

  <path d="M 358 310 C 358 254, 220 254, 215 308" fill="none" stroke="#C8102E" stroke-width="1" marker-end="url(#arrow-red)" stroke-dasharray="3 2"/>
  <text x="290" y="248" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#C8102E">accumulate context pollution</text>

  <!-- Bottom rule + caption -->
  <line x1="32" y1="408" x2="668" y2="408" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="432" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Both flows cost 60 minutes. The 15 minutes Path A spent upstream are the difference between a tool</text>
  <text x="32" y="448" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Seth used daily and a script he stopped opening after a week.</text>
</svg>
