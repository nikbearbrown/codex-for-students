<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The verification loop</title>
  <desc id="desc">A four-node diagram showing the verification loop. Spec leads to Generate, Generate leads to Verify, Verify either flows back to revise the spec or out to the human reviewer. The loop converts the prompt from a one-shot request into a feedback system.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C8102E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>

  <text x="32" y="56" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">FIGURE 9.2 — THE VERIFICATION LOOP</text>
  <text x="32" y="88" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">A check command turns a prompt into a feedback system</text>

  <!-- Node centers laid out in a diamond/loop -->
  <!-- SPEC (left), GENERATE (top), VERIFY (right), HUMAN (bottom-right) -->

  <!-- SPEC -->
  <rect x="60" y="200" width="140" height="80" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="130" y="222" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454" font-weight="bold">SPEC</text>
  <text x="130" y="244" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">five elements</text>
  <text x="130" y="262" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">+ verification command</text>

  <!-- GENERATE -->
  <rect x="280" y="140" width="140" height="64" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="350" y="162" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454" font-weight="bold">GENERATE</text>
  <text x="350" y="184" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Codex implements</text>

  <!-- VERIFY -->
  <rect x="500" y="200" width="140" height="80" fill="#F5EFE8" stroke="#C8102E" stroke-width="1"/>
  <text x="570" y="222" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#C8102E" font-weight="bold">VERIFY</text>
  <text x="570" y="244" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#C8102E">run check command</text>
  <text x="570" y="262" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">tests · lint · screenshot</text>

  <!-- HUMAN -->
  <rect x="280" y="320" width="140" height="64" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="350" y="342" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454" font-weight="bold">HUMAN</text>
  <text x="350" y="364" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">read; ship or rewind</text>

  <!-- Arrows -->
  <!-- SPEC → GENERATE -->
  <line x1="180" y1="210" x2="288" y2="160" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="208" y="172" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">prompt</text>

  <!-- GENERATE → VERIFY -->
  <line x1="420" y1="180" x2="510" y2="220" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="450" y="184" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">output</text>

  <!-- VERIFY → SPEC (revise loop, red) -->
  <path d="M 500 250 Q 350 250, 200 250" fill="none" stroke="#C8102E" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <text x="350" y="270" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#C8102E">fail → revise spec; rerun</text>

  <!-- VERIFY → HUMAN (pass) -->
  <line x1="510" y1="265" x2="420" y2="335" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="430" y="312" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">pass → surface</text>

  <!-- Side annotations -->
  <text x="32" y="426" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">WITHOUT THE LOOP</text>
  <text x="32" y="442" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">one-shot prompt; first output reaches you raw</text>

  <text x="378" y="426" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#C8102E">WITH THE LOOP</text>
  <text x="378" y="442" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">output has already been checked against your criteria</text>

  <!-- Bottom rule + caption -->
  <line x1="32" y1="458" x2="668" y2="458" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
</svg>
