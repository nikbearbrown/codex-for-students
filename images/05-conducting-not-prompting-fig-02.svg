<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The Ask Mode / Code Mode gate</title>
  <desc id="desc">Three-stage flow. Human in Ask Mode (interrogate, plan, formulate) feeds into a gate where the plan is reviewed and approved. The gate releases work into Code Mode (execute against plan, verify output).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <text x="32" y="48" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">FIGURE 5.2 — THE GATE</text>
  <text x="32" y="76" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Nothing goes from Ask Mode to Code Mode until you have reviewed the plan</text>

  <!-- Three stages: Ask Mode, Gate, Code Mode -->
  <!-- Ask Mode -->
  <rect x="40" y="140" width="190" height="160" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="135" y="164" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">ASK MODE</text>
  <text x="135" y="190" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#2a1a0e">Human</text>
  <text x="50" y="222" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">→ interrogate</text>
  <text x="50" y="240" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">→ plan</text>
  <text x="50" y="258" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">→ formulate</text>
  <text x="50" y="284" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">no files change.</text>

  <!-- Arrow into gate -->
  <line x1="232" y1="220" x2="270" y2="220" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gate (highlighted red) -->
  <rect x="280" y="160" width="140" height="120" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="350" y="184" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#C8102E">THE GATE</text>
  <text x="350" y="212" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#C8102E">plan reviewed</text>
  <text x="350" y="228" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#C8102E">and approved</text>
  <text x="350" y="254" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">find one assumption.</text>
  <text x="350" y="268" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">confirm or correct.</text>

  <!-- Arrow into Code Mode -->
  <line x1="422" y1="220" x2="460" y2="220" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Code Mode -->
  <rect x="470" y="140" width="190" height="160" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="565" y="164" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">CODE MODE</text>
  <text x="565" y="190" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#2a1a0e">Human</text>
  <text x="480" y="222" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">→ execute</text>
  <text x="480" y="240" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">→ check handoff</text>
  <text x="480" y="258" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">→ verify output</text>
  <text x="480" y="284" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">files, state, effects.</text>

  <!-- Bottom rule + caption -->
  <line x1="32" y1="336" x2="668" y2="336" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="358" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">The gate is not a skim. It is a specific review with a specific purpose — finding the assumptions Codex made that you did not state.</text>
  <text x="32" y="374" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">The correction in Ask Mode costs a sentence. The correction in Code Mode costs a rollback.</text>
</svg>
