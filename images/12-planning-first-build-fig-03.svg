<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Two timelines — planned versus unplanned build</title>
  <desc id="desc">Two horizontal timelines stacked. The top is a planned build — steady, predictable, finishing at two hours ten. The bottom is an unplanned build — jagged, with three rework loops, finishing at three hours and going past the planned end. Same total time would have been longer; planning removed ninety minutes.</desc>

  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>

  <text x="32" y="48" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">FIGURE 12.3 — PLANNED VS. UNPLANNED</text>
  <text x="32" y="76" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Same build, two trajectories — the unplanned one finishes later</text>

  <!-- Timeline 1: Planned -->
  <text x="32" y="120" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#2a1a0e">PLANNED — 2h 10m</text>
  <rect x="32" y="132" width="540" height="56" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Phases inside planned timeline: thinking (40m, ~155px) then build (90m, ~349px) -->
  <!-- total scale: 540px = 210 min -->
  <!-- thinking block: 40 min wide ≈ 103px -->
  <rect x="32" y="132" width="103" height="56" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="83" y="156" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">thinking</text>
  <text x="83" y="170" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" fill="#545454">40 min</text>

  <!-- Build block: 90 min ≈ 231px -->
  <rect x="135" y="132" width="231" height="56" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="250" y="156" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">build</text>
  <text x="250" y="170" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" fill="#545454">90 min</text>

  <!-- finish marker -->
  <line x1="366" y1="124" x2="366" y2="200" stroke="#1A3A5C" stroke-width="1.5"/>
  <text x="370" y="208" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#1A3A5C">DONE 2:10</text>

  <!-- Tick marks for time axis above planned timeline -->
  <line x1="32" y1="132" x2="572" y2="132" stroke="#D4D4D4" stroke-width="0.5"/>

  <!-- Timeline 2: Unplanned -->
  <text x="32" y="240" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#C8102E">UNPLANNED — 3h 00m</text>
  <rect x="32" y="252" width="540" height="56" fill="#F5EFE8" stroke="#C8102E" stroke-width="1"/>

  <!-- Unplanned: short thinking (2m ≈ 5px), then jagged build with rework loops -->
  <!-- segment 1: code (40m, ≈103px) -->
  <rect x="32" y="252" width="103" height="56" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="83" y="276" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">build</text>
  <text x="83" y="290" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" fill="#545454">40 min</text>

  <!-- rework 1 (20m ≈ 51px) -->
  <rect x="135" y="252" width="51" height="56" fill="#F5EFE8" stroke="#C8102E" stroke-width="1"/>
  <text x="160" y="276" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#C8102E">rework</text>
  <!-- loop arrow indicator -->
  <path d="M 142 282 q 18 -16 36 0" fill="none" stroke="#C8102E" stroke-width="1"/>

  <!-- build 2 (30m ≈ 77px) -->
  <rect x="186" y="252" width="77" height="56" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="224" y="276" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">build</text>
  <text x="224" y="290" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" fill="#545454">30 min</text>

  <!-- rework 2 (30m ≈ 77px) -->
  <rect x="263" y="252" width="77" height="56" fill="#F5EFE8" stroke="#C8102E" stroke-width="1"/>
  <text x="301" y="276" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#C8102E">rework</text>
  <path d="M 270 282 q 28 -16 56 0" fill="none" stroke="#C8102E" stroke-width="1"/>

  <!-- build 3 (40m ≈ 103px) -->
  <rect x="340" y="252" width="103" height="56" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="391" y="276" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">build</text>
  <text x="391" y="290" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" fill="#545454">40 min</text>

  <!-- rework 3 (20m ≈ 51px) -->
  <rect x="443" y="252" width="51" height="56" fill="#F5EFE8" stroke="#C8102E" stroke-width="1"/>
  <text x="468" y="276" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" fill="#C8102E">rework</text>
  <path d="M 450 282 q 18 -16 36 0" fill="none" stroke="#C8102E" stroke-width="1"/>

  <!-- build 4 (20m ≈ 51px) -->
  <rect x="494" y="252" width="51" height="56" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="519" y="276" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">build</text>
  <text x="519" y="290" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" fill="#545454">20 min</text>

  <line x1="545" y1="244" x2="545" y2="320" stroke="#C8102E" stroke-width="1.5"/>
  <text x="549" y="328" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#C8102E">DONE 3:00</text>

  <!-- shared time axis label -->
  <line x1="32" y1="360" x2="572" y2="360" stroke="#D4D4D4" stroke-width="0.5"/>
  <text x="32" y="376" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">0:00</text>
  <text x="160" y="376" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">0:30</text>
  <text x="289" y="376" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">1:00</text>
  <text x="417" y="376" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">1:30</text>
  <text x="545" y="376" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">2:00+</text>
  <text x="296" y="392" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">TIME →</text>

  <!-- legend -->
  <rect x="32" y="410" width="14" height="10" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="50" y="419" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">forward work</text>
  <rect x="160" y="410" width="14" height="10" fill="#F5EFE8" stroke="#C8102E" stroke-width="1"/>
  <text x="178" y="419" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">rework loop</text>

  <!-- Bottom rule + caption -->
  <line x1="32" y1="444" x2="668" y2="444" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="464" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">The planned timeline is steady because the assumptions were caught upstream. The unplanned timeline is jagged because each assumption surfaced as rework downstream.</text>
</svg>
