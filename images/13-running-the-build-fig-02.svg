<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Three pivotal moments in the build</title>
  <desc id="desc">Three labeled boxes side by side — Plan deviation, Test failure, Scope drift. Each names the trigger, the temptation, and a one-line do-this prompt. The middle box is highlighted because the plausibility-audit fire is the move that requires trusting the feeling.</desc>

  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>

  <text x="32" y="48" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">FIGURE 13.2 — THREE PIVOTAL MOMENTS</text>
  <text x="32" y="76" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Distinct triggers, distinct responses — the discipline is recognizing them</text>

  <!-- Three boxes -->
  <!-- Box 1: Plan deviation -->
  <g>
    <rect x="32" y="116" width="206" height="280" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
    <rect x="32" y="116" width="206" height="36" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
    <text x="135" y="139" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" letter-spacing="0.08em" fill="#2a1a0e">PLAN DEVIATION</text>

    <text x="44" y="174" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Trigger</text>
    <text x="44" y="190" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Output contradicts the spec</text>
    <text x="44" y="204" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">or fails the handoff condition.</text>

    <text x="44" y="232" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Temptation</text>
    <text x="44" y="248" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">Write a follow-up prompt</text>
    <text x="44" y="262" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">to fix it forward.</text>

    <text x="44" y="298" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#C8102E">Do this</text>
    <text x="44" y="318" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#C8102E">/rewind</text>
    <text x="44" y="340" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">Revert. Respecify with the</text>
    <text x="44" y="354" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">failure mode as an explicit</text>
    <text x="44" y="368" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">negative constraint.</text>
  </g>

  <!-- Box 2: Test failure (highlighted — the PA-fire moment) -->
  <g>
    <rect x="248" y="116" width="206" height="280" fill="#FFFFFF" stroke="#C8102E" stroke-width="1"/>
    <rect x="248" y="116" width="206" height="36" fill="#F5EFE8" stroke="#C8102E" stroke-width="1"/>
    <text x="351" y="139" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" letter-spacing="0.08em" fill="#C8102E">TEST FAILURE</text>

    <text x="260" y="174" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Trigger</text>
    <text x="260" y="190" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">The handoff passed but the</text>
    <text x="260" y="204" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">plausibility audit fires.</text>

    <text x="260" y="232" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Temptation</text>
    <text x="260" y="248" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">Dismiss it — the tests</text>
    <text x="260" y="262" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">passed, ship it.</text>

    <text x="260" y="298" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#C8102E">Do this</text>
    <text x="260" y="318" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#C8102E">investigate the feeling</text>
    <text x="260" y="340" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">The condition you wrote was</text>
    <text x="260" y="354" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">the condition you thought to</text>
    <text x="260" y="368" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">write. PA is the gap.</text>
  </g>

  <!-- Box 3: Scope drift -->
  <g>
    <rect x="464" y="116" width="206" height="280" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
    <rect x="464" y="116" width="206" height="36" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
    <text x="567" y="139" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" letter-spacing="0.08em" fill="#2a1a0e">SCOPE DRIFT</text>

    <text x="476" y="174" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Trigger</text>
    <text x="476" y="190" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Codex offers an adjacent</text>
    <text x="476" y="204" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">feature not in the spec.</text>

    <text x="476" y="232" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Temptation</text>
    <text x="476" y="248" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">It's useful — let it stay</text>
    <text x="476" y="262" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">in the output, just this once.</text>

    <text x="476" y="298" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#C8102E">Do this</text>
    <text x="476" y="318" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#C8102E">log it, decline now</text>
    <text x="476" y="340" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">Add it to Out-of-scope.</text>
    <text x="476" y="354" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">Re-prompt without it.</text>
    <text x="476" y="368" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">Hold the current boundary.</text>
  </g>

  <!-- Bottom rule + caption -->
  <line x1="32" y1="424" x2="668" y2="424" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="446" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Each moment is a distinct trigger with a distinct response. The highlighted moment is the hardest — the one where the discipline is to investigate</text>
  <text x="32" y="462" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">a feeling rather than dismiss it.</text>
</svg>
