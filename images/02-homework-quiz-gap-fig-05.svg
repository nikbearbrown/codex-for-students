<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Where the gap is largest — Anthropic 2026 RCT</title>
  <desc id="desc">Horizontal bar chart of the performance gap between hand-coding and AI-assisted groups across three question types. Declarative gap is smallest, Generative moderate, Diagnostic largest. The diagnostic gap dwarfs the others.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="360" fill="#FFFFFF"/>

  <text x="32" y="48" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">FIGURE 2.5 — WHERE THE GAP IS LARGEST</text>
  <text x="32" y="76" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Diagnostic questions show the largest gap — and that is not a coincidence</text>

  <!-- Plot area -->
  <rect x="160" y="108" width="460" height="180" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>

  <!-- X axis ticks: gap 0, 5, 10, 15, 20, 25 points -->
  <!-- Width 460 → 25 points = 460. 1pt = 18.4 -->
  <line x1="160" y1="288" x2="160" y2="294" stroke="#545454"/>
  <text x="160" y="306" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">0</text>
  <line x1="252" y1="288" x2="252" y2="294" stroke="#545454"/>
  <text x="252" y="306" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">5</text>
  <line x1="344" y1="288" x2="344" y2="294" stroke="#545454"/>
  <text x="344" y="306" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">10</text>
  <line x1="436" y1="288" x2="436" y2="294" stroke="#545454"/>
  <text x="436" y="306" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">15</text>
  <line x1="528" y1="288" x2="528" y2="294" stroke="#545454"/>
  <text x="528" y="306" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">20</text>
  <line x1="620" y1="288" x2="620" y2="294" stroke="#545454"/>
  <text x="620" y="306" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">25</text>
  <text x="390" y="324" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454">PERFORMANCE GAP (POINTS)</text>

  <!-- Bar 1: Declarative — gap ~7 points -->
  <rect x="160" y="130" width="128.8" height="36" fill="#6B3520"/>
  <text x="152" y="153" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">Declarative</text>
  <text x="298" y="153" font-family="'EB Garamond', Georgia, serif" font-size="11" font-weight="bold" fill="#6B3520">7 pts</text>

  <!-- Bar 2: Generative — gap ~13 points -->
  <rect x="160" y="180" width="239.2" height="36" fill="#1A3A5C"/>
  <text x="152" y="203" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">Generative</text>
  <text x="408" y="203" font-family="'EB Garamond', Georgia, serif" font-size="11" font-weight="bold" fill="#1A3A5C">13 pts</text>

  <!-- Bar 3: Diagnostic — gap ~23 points (RED, HIGHLIGHTED) -->
  <rect x="160" y="230" width="423.2" height="36" fill="#C8102E"/>
  <text x="152" y="253" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="11" font-weight="bold" fill="#C8102E">Diagnostic</text>
  <text x="592" y="253" font-family="'EB Garamond', Georgia, serif" font-size="11" font-weight="bold" fill="#C8102E">23 pts</text>

  <!-- Bottom rule + caption -->
  <line x1="32" y1="334" x2="668" y2="334" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="354" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Debugging is the irreducible cognitive skill. Letting the AI find and name the bug skips the prediction-vs-observation loop that builds it.</text>
</svg>
