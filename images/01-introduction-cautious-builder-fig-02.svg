<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The Bastani RCT — practice score vs. unassisted exam</title>
  <desc id="desc">Line chart of three groups — no AI, AI without guardrails, AI with guardrails. The AI-without-guardrails group rises 48 points on the practice score and falls 17 points below baseline on the unassisted exam.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>

  <text x="32" y="48" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">FIGURE 1.2 — BASTANI ET AL.</text>
  <text x="32" y="76" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">The 17-point drop appears only when the AI is removed</text>

  <!-- Plot area -->
  <rect x="80" y="120" width="500" height="240" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Y axis ticks (relative to baseline 0) -->
  <text x="72" y="138" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">+50</text>
  <line x1="76" y1="135" x2="80" y2="135" stroke="#545454" stroke-width="1"/>
  <text x="72" y="178" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">+25</text>
  <line x1="76" y1="175" x2="80" y2="175" stroke="#545454" stroke-width="1"/>
  <text x="72" y="222" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">0</text>
  <line x1="76" y1="219" x2="80" y2="219" stroke="#545454" stroke-width="1"/>
  <text x="72" y="262" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">-25</text>
  <line x1="76" y1="259" x2="80" y2="259" stroke="#545454" stroke-width="1"/>

  <!-- Baseline (zero) reference -->
  <line x1="80" y1="219" x2="580" y2="219" stroke="#545454" stroke-width="0.75" stroke-dasharray="4 3"/>

  <!-- Y axis label -->
  <text x="32" y="240" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" letter-spacing="0.08em" fill="#545454" transform="rotate(-90 32 240)">POINTS VS. BASELINE</text>

  <!-- X axis labels -->
  <text x="170" y="382" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">Practice score</text>
  <text x="490" y="382" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">Unassisted exam</text>

  <!-- X positions: practice = 170, exam = 490 -->
  <!-- y mapping: baseline (0) = 219, +48 = 142.2, -17 = 246.2, +5 = 211, +3 = 214 (guardrails near baseline) -->

  <!-- Line: No AI — flat at baseline -->
  <line x1="170" y1="219" x2="490" y2="219" stroke="#1A3A5C" stroke-width="2"/>
  <circle cx="170" cy="219" r="5" fill="#1A3A5C"/>
  <circle cx="490" cy="219" r="5" fill="#1A3A5C"/>

  <!-- Line: AI with guardrails — practice +5, exam baseline -->
  <line x1="170" y1="211" x2="490" y2="219" stroke="#6B3520" stroke-width="2"/>
  <circle cx="170" cy="211" r="5" fill="#6B3520"/>
  <circle cx="490" cy="219" r="5" fill="#6B3520"/>

  <!-- Line: AI without guardrails — practice +48, exam -17 (THE DROP, RED) -->
  <line x1="170" y1="142" x2="490" y2="246" stroke="#C8102E" stroke-width="2.5"/>
  <circle cx="170" cy="142" r="6" fill="#C8102E"/>
  <circle cx="490" cy="246" r="6" fill="#C8102E"/>

  <!-- Labels at right end of each line -->
  <text x="500" y="223" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#1A3A5C">No AI (baseline)</text>
  <text x="500" y="206" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#6B3520">AI + guardrails</text>
  <text x="500" y="250" font-family="'EB Garamond', Georgia, serif" font-size="11" font-weight="bold" fill="#C8102E">AI, no guardrails</text>

  <!-- Annotation for the drop -->
  <text x="170" y="130" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#C8102E">+48</text>
  <text x="490" y="265" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" font-weight="bold" fill="#C8102E">−17</text>

  <!-- Drop annotation -->
  <text x="330" y="170" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#C8102E">65-point divergence</text>
  <text x="330" y="186" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">between conditions</text>

  <!-- Bottom rule + caption -->
  <line x1="32" y1="412" x2="668" y2="412" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="436" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Source: Bastani et al., randomized controlled trial, middle-school algebra. The gap appears only at the unassisted task.</text>
  <text x="32" y="452" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Cohen's d = 0.738. p = 0.01. Practice scores and exam scores plotted as points-from-baseline for visual comparability.</text>
</svg>
