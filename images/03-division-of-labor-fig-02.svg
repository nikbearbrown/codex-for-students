<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The five supervisory capacities</title>
  <desc id="desc">Vertical stack of five capacities — Plausibility Auditing, Problem Formulation, Interpretive Judgment, Tool Orchestration, Executive Integration — each with a three-to-five word gloss. The reference card the reader will return to in later chapters.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>

  <text x="32" y="48" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">FIGURE 3.2 — THE FIVE SUPERVISORY CAPACITIES</text>
  <text x="32" y="76" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">The five things you keep, no matter how fluent Codex becomes</text>

  <!-- Five rows, height 60, gap 8 -->
  <!-- Row 1: PA -->
  <rect x="32" y="108" width="636" height="60" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="32" y="108" width="120" height="60" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="92" y="132" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" letter-spacing="0.08em" fill="#2a1a0e">PA</text>
  <text x="92" y="152" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Plausibility</text>
  <text x="92" y="164" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Auditing</text>
  <text x="170" y="134" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#2a1a0e">Hear the wrong note before verification</text>
  <text x="170" y="155" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#545454">The itch that something is off, before you can name what.</text>

  <!-- Row 2: PF -->
  <rect x="32" y="176" width="636" height="60" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="32" y="176" width="120" height="60" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="92" y="200" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" letter-spacing="0.08em" fill="#2a1a0e">PF</text>
  <text x="92" y="220" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Problem</text>
  <text x="92" y="232" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Formulation</text>
  <text x="170" y="202" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#2a1a0e">Decide what the build is before Codex sees it</text>
  <text x="170" y="223" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#545454">Codex optimizes within the frame. You set the frame.</text>

  <!-- Row 3: IJ -->
  <rect x="32" y="244" width="636" height="60" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="32" y="244" width="120" height="60" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="92" y="268" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" letter-spacing="0.08em" fill="#2a1a0e">IJ</text>
  <text x="92" y="288" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Interpretive</text>
  <text x="92" y="300" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Judgment</text>
  <text x="170" y="270" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#2a1a0e">Supply meaning the output cannot carry</text>
  <text x="170" y="291" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#545454">"Old," "modified," "average" mean different things in your project.</text>

  <!-- Row 4: TO -->
  <rect x="32" y="312" width="636" height="60" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="32" y="312" width="120" height="60" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="92" y="336" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" letter-spacing="0.08em" fill="#2a1a0e">TO</text>
  <text x="92" y="356" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Tool</text>
  <text x="92" y="368" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Orchestration</text>
  <text x="170" y="338" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#2a1a0e">Choose which mode, in what order, with what trust</text>
  <text x="170" y="359" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#545454">Ask vs. Code Mode, best-of-N, by-hand. Sequencing matters.</text>

  <!-- Row 5: EI -->
  <rect x="32" y="380" width="636" height="60" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="32" y="380" width="120" height="60" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="92" y="404" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" letter-spacing="0.08em" fill="#2a1a0e">EI</text>
  <text x="92" y="424" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Executive</text>
  <text x="92" y="436" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">Integration</text>
  <text x="170" y="406" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#2a1a0e">Hold the whole build toward a single goal</text>
  <text x="170" y="427" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#545454">Codex starts fresh each session. You don't.</text>

  <!-- Bottom rule + caption -->
  <line x1="32" y1="456" x2="668" y2="456" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="32" y="474" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">None of these has a horizon on which a model release closes it — because each depends on information Codex does not have.</text>
</svg>
