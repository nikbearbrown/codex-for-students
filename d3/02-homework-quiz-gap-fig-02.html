<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.2 — Fluency vs. Mastery</title>
<style>
:root {
  --color-white: #FFFFFF;
  --color-fill: #F5EFE8;
  --color-ink: #2a1a0e;
  --color-mark: #6B3520;
  --color-red: #C8102E;
  --color-slate: #1A3A5C;
  --color-ochre: #C8860E;
  --color-secondary: #545454;
  --color-border: #D4D4D4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-white: #111111;
    --color-fill: #1a1612;
    --color-ink: #F0EBE3;
    --color-mark: #C8865E;
    --color-red: #E8243A;
    --color-slate: #6B8FB8;
    --color-ochre: #D49A30;
    --color-secondary: #A0978C;
    --color-border: #2E2E2E;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
#chart { width: 100%; min-height: 440px; }
.tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-slate); color: var(--color-white); padding: 8px 12px; font-size: 12px; font-family: 'EB Garamond', Georgia, serif; max-width: 280px; line-height: 1.4; }
text { font-family: 'EB Garamond', Georgia, serif; fill: var(--color-ink); }
.caps { font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; letter-spacing: 0.08em; fill: var(--color-secondary); font-size: 10px; }
.mono { font-family: 'IBM Plex Mono', monospace; font-size: 9px; }
.secondary { fill: var(--color-secondary); }
.panel { fill: var(--color-fill); stroke: var(--color-border); stroke-width: 1; cursor: pointer; transition: fill 120ms; }
.panel:hover { fill: var(--color-white); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<div class="tooltip" id="tt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
function draw() {
  d3.select('#chart').selectAll('*').remove();
  const totalWidth = document.getElementById('chart').clientWidth || 700;
  const totalHeight = 440;
  const margin = { top: 56, right: 24, bottom: 56, left: 24 };
  const chartWidth = totalWidth - margin.left - margin.right;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  svg.append('title').attr('id','chart-title').text('Fluency vs. Mastery');
  svg.append('desc').attr('id','chart-desc').text('Two-panel illustration. Panel A: brain reading smooth output. Panel B: brain mid-struggle with crossed-out predictions.');

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  g.append('text').attr('class','caps').attr('y',-24).text('FIGURE 2.2 — FLUENCY VS. MASTERY');
  g.append('text').attr('y',0).attr('font-weight','bold').attr('font-size',13).text('The experience is identical. The neural events are not.');

  const tt = d3.select('#tt');
  function showTip(html){ tt.html(html).style('opacity',1); }
  function moveTip(e){ tt.style('left',(e.pageX+12)+'px').style('top',(e.pageY-8)+'px'); }
  function hideTip(){ tt.style('opacity',0); }

  const panelW = (chartWidth - 28) / 2;

  function drawBrain(cx, cy, sparks) {
    const path = `M ${cx-84} ${cy} C ${cx-84} ${cy-28}, ${cx-64} ${cy-46}, ${cx-40} ${cy-46} C ${cx-32} ${cy-58}, ${cx-14} ${cy-62}, ${cx} ${cy-52} C ${cx+14} ${cy-62}, ${cx+32} ${cy-58}, ${cx+40} ${cy-46} C ${cx+64} ${cy-46}, ${cx+84} ${cy-28}, ${cx+84} ${cy} C ${cx+84} ${cy+28}, ${cx+64} ${cy+46}, ${cx+40} ${cy+46} C ${cx+32} ${cy+58}, ${cx+14} ${cy+62}, ${cx} ${cy+52} C ${cx-14} ${cy+62}, ${cx-32} ${cy+58}, ${cx-40} ${cy+46} C ${cx-64} ${cy+46}, ${cx-84} ${cy+28}, ${cx-84} ${cy} Z`;
    g.append('path').attr('d',path).attr('fill','var(--color-white)').attr('stroke','var(--color-ink)').attr('stroke-width',1.5);
    [-64,-34,0,34,64].forEach(dx => {
      g.append('path').attr('d',`M ${cx+dx} ${cy-20} Q ${cx+dx+20} ${cy+6}, ${cx+dx} ${cy+26}`).attr('stroke','var(--color-ink)').attr('stroke-width',0.75).attr('fill','none');
    });
    if (sparks) {
      [[-50,-20],[-6,-36],[44,-12],[-18,24]].forEach(([dx,dy]) => {
        g.append('circle').attr('cx',cx+dx).attr('cy',cy+dy).attr('r',2).attr('fill','var(--color-red)');
      });
    }
  }

  // Panel A
  g.append('rect').attr('class','panel').attr('x',0).attr('y',32).attr('width',panelW).attr('height',240)
    .on('mouseenter',()=>showTip('<strong>FLUENCY.</strong> The brain reads coherent, elegant output and registers it the way it registers any well-written text. No prediction was attempted, so no mismatch can register. No dopamine, no BDNF, no spines. The session feels productive. Nothing was learned.'))
    .on('mousemove',moveTip).on('mouseleave',hideTip);
  g.append('text').attr('class','caps').attr('x',panelW/2).attr('y',56).attr('text-anchor','middle').text('PANEL A — FLUENCY');
  drawBrain(panelW/2, 156, false);
  g.append('rect').attr('x',panelW/2-100).attr('y',220).attr('width',200).attr('height',40).attr('fill','var(--color-white)').attr('stroke','var(--color-border)').attr('stroke-width',1);
  g.append('text').attr('class','mono').attr('x',panelW/2-92).attr('y',236).text('def trace_signals(g):');
  g.append('text').attr('class','mono').attr('x',panelW/2-92).attr('y',248).attr('fill','var(--color-secondary)').text('    return resolve(g)  # ✓');
  g.append('text').attr('class','secondary').attr('x',panelW/2).attr('y',282).attr('text-anchor','middle').attr('font-size',11).text('smooth read → checkmark → done');

  // Panel B
  const x2 = panelW + 28;
  g.append('rect').attr('class','panel').attr('x',x2).attr('y',32).attr('width',panelW).attr('height',240)
    .on('mouseenter',()=>showTip('<strong>MASTERY.</strong> A prediction was made and turned out to be wrong. The mismatch fired prediction error. Dopamine released. BDNF upregulated. Spines formed. From inside, the experience felt the same as Panel A. Underneath, the brain physically changed.'))
    .on('mousemove',moveTip).on('mouseleave',hideTip);
  g.append('text').attr('class','caps').attr('x',x2+panelW/2).attr('y',56).attr('text-anchor','middle').text('PANEL B — MASTERY');
  drawBrain(x2+panelW/2, 156, true);
  g.append('rect').attr('x',x2+panelW/2-100).attr('y',220).attr('width',200).attr('height',40).attr('fill','var(--color-white)').attr('stroke','var(--color-border)').attr('stroke-width',1);
  g.append('text').attr('class','mono').attr('x',x2+panelW/2-92).attr('y',236).attr('fill','var(--color-secondary)').text('predict: emit B first');
  g.append('line').attr('x1',x2+panelW/2-92).attr('y1',233).attr('x2',x2+panelW/2+30).attr('y2',233).attr('stroke','var(--color-red)').attr('stroke-width',1);
  g.append('text').attr('class','mono').attr('x',x2+panelW/2-92).attr('y',248).text('→ actually: emit A first');
  g.append('text').attr('class','secondary').attr('x',x2+panelW/2).attr('y',282).attr('text-anchor','middle').attr('font-size',11).text('predict → mismatch → adjust → learn');

  // Caption
  g.append('line').attr('x1',0).attr('y1',304).attr('x2',chartWidth).attr('y2',304)
    .attr('stroke','var(--color-border)').attr('stroke-width',0.75).attr('stroke-dasharray','4 3');
  g.append('text').attr('class','secondary').attr('y',326).attr('font-size',10).text('From inside, both brains feel like they are learning. Only one is. Hover either panel for the mechanism.');
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
