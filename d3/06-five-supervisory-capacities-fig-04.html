<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 6.4 — Executive Integration across a session</title>
<style>
:root {
  --color-white: #FFFFFF;
  --color-fill: #F5EFE8;
  --color-ink: #2a1a0e;
  --color-mark: #6B3520;
  --color-red: #C8102E;
  --color-slate: #1A3A5C;
  --color-ochre: #C8860E;
  --color-secondary: #545454;
  --color-border: #D4D4D4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-white: #111111;
    --color-fill: #1a1612;
    --color-ink: #F0EBE3;
    --color-mark: #C8865E;
    --color-red: #E8243A;
    --color-slate: #6B8FB8;
    --color-ochre: #D49A30;
    --color-secondary: #A0978C;
    --color-border: #2E2E2E;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
#chart { width: 100%; min-height: 440px; }
.tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-slate); color: var(--color-white); padding: 8px 12px; font-size: 12px; font-family: 'EB Garamond', Georgia, serif; max-width: 260px; line-height: 1.4; }
text { font-family: 'EB Garamond', Georgia, serif; fill: var(--color-ink); }
.caps { font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; letter-spacing: 0.08em; fill: var(--color-secondary); font-size: 9px; }
.secondary { fill: var(--color-secondary); }
.event { cursor: pointer; }
.event circle { transition: r 120ms; }
.event:hover circle { r: 8; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<div class="tooltip" id="tt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
function draw() {
  d3.select('#chart').selectAll('*').remove();
  const totalWidth = document.getElementById('chart').clientWidth || 700;
  const totalHeight = 420;

  const svg = d3.select('#chart').append('svg').attr('viewBox',`0 0 ${totalWidth} ${totalHeight}`)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  svg.append('defs').append('marker').attr('id','arrow').attr('markerWidth',8).attr('markerHeight',6).attr('refX',7).attr('refY',3).attr('orient','auto')
    .append('polygon').attr('points','0 0, 8 3, 0 6').attr('fill','var(--color-ink)');
  svg.append('title').attr('id','chart-title').text('Executive Integration across a session');
  svg.append('desc').attr('id','chart-desc').text('Horizontal timeline of a Codex session with decision, redirect, pivot, and EI-fires moments marked.');

  svg.append('text').attr('class','caps').attr('font-size',10).attr('x',32).attr('y',56).text('FIGURE 6.4 — EI ACROSS A SESSION');
  svg.append('text').attr('x',32).attr('y',88).attr('font-weight','bold').attr('font-size',13).text('The long-range capacity that catches drift, not crashes');

  const tt = d3.select('#tt');
  function showTip(html){ tt.html(html).style('opacity',1); }
  function moveTip(e){ tt.style('left',(e.pageX+12)+'px').style('top',(e.pageY-8)+'px'); }
  function hideTip(){ tt.style('opacity',0); }

  const xStart = 64, xEnd = totalWidth - 64, yLine = 240;
  svg.append('line').attr('x1',xStart).attr('y1',yLine).attr('x2',xEnd).attr('y2',yLine).attr('stroke','var(--color-ink)').attr('stroke-width',1.25).attr('marker-end','url(#arrow)');
  svg.append('text').attr('class','caps').attr('x',xStart).attr('y',yLine+22).text('PROMPT 1');
  svg.append('text').attr('class','caps').attr('x',xEnd).attr('y',yLine+22).attr('text-anchor','end').text('PROMPT 13 + SHIP');
  svg.append('text').attr('x',(xStart+xEnd)/2).attr('y',yLine+40).attr('text-anchor','middle').attr('font-size',10).attr('font-style','italic').attr('class','secondary').text('session duration — many prompts, hours, sometimes days');

  // Tick marks
  const promptCount = 13;
  const step = (xEnd - xStart - 24)/promptCount;
  for (let i=1; i<=12; i++){
    const x = xStart + 24 + i*step;
    svg.append('line').attr('x1',x).attr('y1',yLine-6).attr('x2',x).attr('y2',yLine+6).attr('stroke','var(--color-border)').attr('stroke-width',0.75);
  }

  function xPrompt(n){ return xStart + 24 + n*step; }

  const events = [
    { prompt:3, type:'decision', label:'DECISION', sub:'constraint set: no rewrites', y:130,
      tip:'The constraint set early in the session. The thing EI is responsible for remembering across the next ten prompts.' },
    { prompt:7, type:'redirect', label:'REDIRECT', sub:'small course correction', y:328, downward:true,
      tip:'A small course correction — locally reasonable, but visible to EI as a possible drift signal if it accumulates.' },
    { prompt:11, type:'pivot', label:'PIVOT', sub:'re-scope adjacent feature', y:148,
      tip:'Adjacent feature re-scoped. Reasonable in isolation. EI is tracking whether this drift is consistent with the prompt-3 constraint.' },
    { prompt:13, type:'ei', label:'EI FIRES — STOP', sub:'cumulative result violates', sub2:'the prompt-3 constraint', y:336, downward:true, highlight:true,
      tip:'EI fires before ship. The cumulative drift is now visible as a constraint violation; revert and re-specify rather than patch forward.' }
  ];

  // Drift zone
  svg.append('rect').attr('x',xPrompt(3)+12).attr('y',190).attr('width',xPrompt(11)-xPrompt(3)-12).attr('height',42).attr('fill','var(--color-fill)').attr('stroke','var(--color-border)').attr('stroke-width',1).attr('stroke-dasharray','4 3');
  svg.append('text').attr('x',(xPrompt(3)+xPrompt(11))/2+6).attr('y',206).attr('text-anchor','middle').attr('class','caps').text('DRIFT — LOCALLY REASONABLE PROMPTS');
  svg.append('text').attr('x',(xPrompt(3)+xPrompt(11))/2+6).attr('y',222).attr('text-anchor','middle').attr('font-size',10).attr('font-style','italic').attr('class','secondary').text('each step fine in isolation; cumulative result violates the constraint');

  events.forEach(e => {
    const x = xPrompt(e.prompt);
    const g = svg.append('g').attr('class','event')
      .on('mouseenter',()=>showTip(`<strong>${e.label}</strong><br/>${e.tip}`))
      .on('mousemove',moveTip).on('mouseleave',hideTip);

    g.append('circle').attr('cx',x).attr('cy',yLine).attr('r', e.highlight ? 7 : (e.type==='decision' ? 6 : 5))
      .attr('fill', e.highlight ? 'var(--color-red)' : 'var(--color-ink)');

    if (e.downward){
      g.append('line').attr('x1',x).attr('y1',yLine+6).attr('x2',x).attr('y2',e.y-12).attr('stroke', e.highlight ? 'var(--color-red)' : 'var(--color-ink)').attr('stroke-width', e.highlight ? 1 : 0.75);
    } else {
      g.append('line').attr('x1',x).attr('y1',yLine-6).attr('x2',x).attr('y2',e.y+18).attr('stroke','var(--color-ink)').attr('stroke-width',0.75);
    }

    const boxW = e.sub2 ? 160 : 152;
    const boxH = e.sub2 ? 46 : 32;
    const boxX = Math.max(32, Math.min(totalWidth-boxW-32, x - boxW/2));
    const boxY = e.downward ? e.y-12 : e.y-14;
    g.append('rect').attr('x',boxX).attr('y',boxY).attr('width',boxW).attr('height',boxH)
      .attr('fill','var(--color-fill)').attr('stroke', e.highlight ? 'var(--color-red)' : 'var(--color-border)').attr('stroke-width',1);
    g.append('text').attr('x',boxX+8).attr('y',boxY+14).attr('class','caps').attr('fill', e.highlight ? 'var(--color-red)' : 'var(--color-secondary)').attr('font-weight', e.highlight ? 'bold' : 'normal').text(e.label);
    g.append('text').attr('x',boxX+8).attr('y',boxY+26).attr('font-size',10).text(e.sub);
    if (e.sub2) g.append('text').attr('x',boxX+8).attr('y',boxY+38).attr('font-size',10).text(e.sub2);
  });

  svg.append('line').attr('x1',32).attr('y1',386).attr('x2',totalWidth-32).attr('y2',386).attr('stroke','var(--color-border)').attr('stroke-width',0.75).attr('stroke-dasharray','4 3');
  svg.append('text').attr('x',32).attr('y',406).attr('class','secondary').attr('font-size',10).text('EI is the only capacity whose horizon is the whole session. AGENTS.md is the scaffold that makes EI scale across sessions, not just within one.');
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
