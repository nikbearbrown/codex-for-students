<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 9.2 — The verification loop</title>
<style>
:root {
  --color-white: #FFFFFF;
  --color-fill: #F5EFE8;
  --color-ink: #2a1a0e;
  --color-mark: #6B3520;
  --color-red: #C8102E;
  --color-slate: #1A3A5C;
  --color-ochre: #C8860E;
  --color-secondary: #545454;
  --color-border: #D4D4D4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-white: #111111;
    --color-fill: #1a1612;
    --color-ink: #F0EBE3;
    --color-mark: #C8865E;
    --color-red: #E8243A;
    --color-slate: #6B8FB8;
    --color-ochre: #D49A30;
    --color-secondary: #A0978C;
    --color-border: #2E2E2E;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
#chart { width: 100%; min-height: 500px; }
.tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-slate); color: var(--color-white); padding: 8px 12px; font-size: 12px; font-family: 'EB Garamond', Georgia, serif; max-width: 280px; line-height: 1.4; }
text { font-family: 'EB Garamond', Georgia, serif; fill: var(--color-ink); }
.caps { font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; letter-spacing: 0.08em; fill: var(--color-secondary); font-size: 10px; }
.secondary { fill: var(--color-secondary); }
.node { cursor: pointer; transition: fill 120ms; }
.node:hover { fill: var(--color-fill); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<div class="tooltip" id="tt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
function draw() {
  d3.select('#chart').selectAll('*').remove();
  const totalWidth = document.getElementById('chart').clientWidth || 700;
  const totalHeight = 480;

  const svg = d3.select('#chart').append('svg').attr('viewBox',`0 0 ${totalWidth} ${totalHeight}`)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  const defs = svg.append('defs');
  defs.append('marker').attr('id','arrow').attr('markerWidth',8).attr('markerHeight',6).attr('refX',7).attr('refY',3).attr('orient','auto')
    .append('polygon').attr('points','0 0, 8 3, 0 6').attr('fill','var(--color-ink)');
  defs.append('marker').attr('id','arrow-red').attr('markerWidth',8).attr('markerHeight',6).attr('refX',7).attr('refY',3).attr('orient','auto')
    .append('polygon').attr('points','0 0, 8 3, 0 6').attr('fill','var(--color-red)');
  svg.append('title').attr('id','chart-title').text('The verification loop');
  svg.append('desc').attr('id','chart-desc').text('Spec → Generate → Verify, with a red revision arrow back to Spec on failure and a forward arrow to Human on pass.');

  svg.append('text').attr('class','caps').attr('x',32).attr('y',56).text('FIGURE 9.2 — THE VERIFICATION LOOP');
  svg.append('text').attr('x',32).attr('y',88).attr('font-weight','bold').attr('font-size',13).text('A check command turns a prompt into a feedback system');

  const tt = d3.select('#tt');
  function showTip(html){ tt.html(html).style('opacity',1); }
  function moveTip(e){ tt.style('left',(e.pageX+12)+'px').style('top',(e.pageY-8)+'px'); }
  function hideTip(){ tt.style('opacity',0); }

  const nodes = [
    { id:'spec', x:60, y:200, w:140, h:80, cap:'SPEC', title:'five elements', sub:'+ verification command',
      tip:'The spec includes a verification command — tests to run, a lint check, a screenshot to compare. Done is defined, and how to check is named.' },
    { id:'gen', x:totalWidth/2-70, y:140, w:140, h:64, cap:'GENERATE', title:'Codex implements',
      tip:'Codex produces the output against the spec. This is the only step that is purely Codex\'s; everything else is human or check.' },
    { id:'verify', x:totalWidth-200, y:200, w:140, h:80, cap:'VERIFY', title:'run check command', sub:'tests · lint · screenshot', highlight:true,
      tip:'The check command runs. If it fails, the loop sends the result back upstream to revise the spec — not to patch the output forward. If it passes, the output surfaces to the human.' },
    { id:'human', x:totalWidth/2-70, y:320, w:140, h:64, cap:'HUMAN', title:'read; ship or rewind',
      tip:'Output has been pre-checked. The human reads, applies supervisory capacities, ships or rewinds — but starts from output that already satisfies the verification criteria.' }
  ];

  nodes.forEach(n => {
    const g = svg.append('g').attr('class','node')
      .on('mouseenter',()=>showTip(`<strong>${n.cap}</strong><br/>${n.tip}`))
      .on('mousemove',moveTip).on('mouseleave',hideTip);
    g.append('rect').attr('x',n.x).attr('y',n.y).attr('width',n.w).attr('height',n.h)
      .attr('fill','var(--color-fill)').attr('stroke', n.highlight ? 'var(--color-red)' : 'var(--color-border)').attr('stroke-width',1);
    g.append('text').attr('class','caps').attr('x',n.x+n.w/2).attr('y',n.y+22).attr('text-anchor','middle').attr('fill', n.highlight ? 'var(--color-red)' : 'var(--color-secondary)').attr('font-weight','bold').text(n.cap).attr('pointer-events','none');
    g.append('text').attr('x',n.x+n.w/2).attr('y',n.y+44).attr('text-anchor','middle').attr('font-weight','bold').attr('font-size',11).attr('fill', n.highlight ? 'var(--color-red)' : 'var(--color-ink)').text(n.title).attr('pointer-events','none');
    if (n.sub) g.append('text').attr('x',n.x+n.w/2).attr('y',n.y+62).attr('text-anchor','middle').attr('font-size',10).attr('font-style','italic').attr('class','secondary').text(n.sub).attr('pointer-events','none');
  });

  function nx(id){ return nodes.find(n=>n.id===id); }

  // SPEC → GENERATE
  svg.append('line').attr('x1',nx('spec').x+nx('spec').w-20).attr('y1',nx('spec').y+10).attr('x2',nx('gen').x+8).attr('y2',nx('gen').y+20).attr('stroke','var(--color-ink)').attr('stroke-width',1).attr('marker-end','url(#arrow)');
  svg.append('text').attr('x',nx('spec').x+nx('spec').w+30).attr('y',172).attr('font-size',10).attr('font-style','italic').attr('class','secondary').text('prompt');

  // GENERATE → VERIFY
  svg.append('line').attr('x1',nx('gen').x+nx('gen').w).attr('y1',nx('gen').y+40).attr('x2',nx('verify').x+10).attr('y2',nx('verify').y+20).attr('stroke','var(--color-ink)').attr('stroke-width',1).attr('marker-end','url(#arrow)');
  svg.append('text').attr('x',nx('gen').x+nx('gen').w+30).attr('y',184).attr('font-size',10).attr('font-style','italic').attr('class','secondary').text('output');

  // VERIFY → SPEC (red revise loop)
  svg.append('path').attr('d',`M ${nx('verify').x} 250 Q ${totalWidth/2} 250, ${nx('spec').x+nx('spec').w} 250`).attr('fill','none').attr('stroke','var(--color-red)').attr('stroke-width',1.25).attr('stroke-dasharray','4 3').attr('marker-end','url(#arrow-red)');
  svg.append('text').attr('x',totalWidth/2).attr('y',270).attr('text-anchor','middle').attr('font-size',10).attr('font-style','italic').attr('fill','var(--color-red)').text('fail → revise spec; rerun');

  // VERIFY → HUMAN
  svg.append('line').attr('x1',nx('verify').x+10).attr('y1',nx('verify').y+65).attr('x2',nx('human').x+nx('human').w-8).attr('y2',nx('human').y+18).attr('stroke','var(--color-ink)').attr('stroke-width',1).attr('marker-end','url(#arrow)');
  svg.append('text').attr('x',nx('human').x+nx('human').w-8).attr('y',312).attr('font-size',10).attr('font-style','italic').attr('class','secondary').text('pass → surface');

  // Bottom annotations
  svg.append('text').attr('class','caps').attr('x',32).attr('y',426).text('WITHOUT THE LOOP');
  svg.append('text').attr('x',32).attr('y',442).attr('font-size',10).text('one-shot prompt; first output reaches you raw');
  svg.append('text').attr('class','caps').attr('x',totalWidth/2+30).attr('y',426).attr('fill','var(--color-red)').text('WITH THE LOOP');
  svg.append('text').attr('x',totalWidth/2+30).attr('y',442).attr('font-size',10).text('output has already been checked against your criteria');

  svg.append('line').attr('x1',32).attr('y1',458).attr('x2',totalWidth-32).attr('y2',458).attr('stroke','var(--color-border)').attr('stroke-width',0.75).attr('stroke-dasharray','4 3');
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
