<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 6.1 — The five supervisory capacities as a pentagon</title>
<style>
:root {
  --color-white: #FFFFFF;
  --color-fill: #F5EFE8;
  --color-ink: #2a1a0e;
  --color-mark: #6B3520;
  --color-red: #C8102E;
  --color-slate: #1A3A5C;
  --color-ochre: #C8860E;
  --color-secondary: #545454;
  --color-border: #D4D4D4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-white: #111111;
    --color-fill: #1a1612;
    --color-ink: #F0EBE3;
    --color-mark: #C8865E;
    --color-red: #E8243A;
    --color-slate: #6B8FB8;
    --color-ochre: #D49A30;
    --color-secondary: #A0978C;
    --color-border: #2E2E2E;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
#chart { width: 100%; min-height: 560px; }
.tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-slate); color: var(--color-white); padding: 8px 12px; font-size: 12px; font-family: 'EB Garamond', Georgia, serif; max-width: 260px; line-height: 1.4; }
text { font-family: 'EB Garamond', Georgia, serif; fill: var(--color-ink); }
.caps { font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; letter-spacing: 0.08em; fill: var(--color-secondary); font-size: 10px; }
.secondary { fill: var(--color-secondary); }
.vertex { cursor: pointer; }
.vertex circle { transition: r 120ms; }
.vertex:hover circle { r: 8; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<div class="tooltip" id="tt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
function draw() {
  d3.select('#chart').selectAll('*').remove();
  const totalWidth = document.getElementById('chart').clientWidth || 700;
  const totalHeight = 540;

  const svg = d3.select('#chart').append('svg')
    .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('The five supervisory capacities as a pentagon');
  svg.append('desc').attr('id', 'chart-desc').text('Pentagon with five labeled vertices — PA, PF, TO, IJ, EI — each a capacity the supervisor keeps.');

  svg.append('text').attr('class','caps').attr('x',32).attr('y',56).text('FIGURE 6.1 — THE FIVE SUPERVISORY CAPACITIES');
  svg.append('text').attr('x',32).attr('y',88).attr('font-weight','bold').attr('font-size',13)
    .text('The five things you do that Codex cannot — one at each vertex');

  const cx = totalWidth/2, cy = 300, r = 130;
  const verts = [];
  for (let i=0; i<5; i++){
    const a = -Math.PI/2 + i*2*Math.PI/5;
    verts.push({x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)});
  }

  // Pentagon
  svg.append('polygon')
    .attr('points', verts.map(v=>`${v.x},${v.y}`).join(' '))
    .attr('fill','var(--color-fill)').attr('stroke','var(--color-border)').attr('stroke-width',1);

  // Center label
  svg.append('text').attr('x',cx).attr('y',cy-2).attr('text-anchor','middle').attr('class','caps').text('SUPERVISORY');
  svg.append('text').attr('x',cx).attr('y',cy+14).attr('text-anchor','middle').attr('class','caps').text('INTELLIGENCE');
  svg.append('text').attr('x',cx).attr('y',cy+34).attr('text-anchor','middle').attr('font-size',10).attr('font-style','italic').attr('class','secondary').text('all five required');

  const tt = d3.select('#tt');
  function showTip(html){ tt.html(html).style('opacity',1); }
  function moveTip(e){ tt.style('left',(e.pageX+12)+'px').style('top',(e.pageY-8)+'px'); }
  function hideTip(){ tt.style('opacity',0); }

  const data = [
    { code:'PA', name:'Plausibility Auditing', gloss1:'hearing the wrong note', gloss2:'before tests do',
      highlight:true, tip:'PA — fires defensively. The off-feeling about output that precedes the articulation. Sharpens with practice; cannot be outsourced.',
      anchor:'top' },
    { code:'PF', name:'Problem Formulation', gloss1:'deciding what the build is', gloss2:'before Codex sees it',
      tip:'PF — the work upstream of any prompt. A well-specified problem produces a well-specified solution; an elegant solution to the wrong question is still wrong.',
      anchor:'right' },
    { code:'TO', name:'Tool Orchestration', gloss1:'which mode, what order,', gloss2:'what trust level',
      tip:'TO — Ask vs. Code Mode, Best-of-N, by hand. The conducting choice: which instrument plays now and on what leash.',
      anchor:'right-bottom' },
    { code:'IJ', name:'Interpretive Judgment', gloss1:'supplying meaning the', gloss2:'output cannot carry',
      tip:'IJ — fires constructively. What does this output mean for this project, this user, this deadline? Domain knowledge is the input.',
      anchor:'left-bottom' },
    { code:'EI', name:'Executive Integration', gloss1:'holding the whole build', gloss2:'toward a single goal',
      tip:'EI — long-range integration. Catches the drift between prompt 3 and prompt 17. AGENTS.md is the scaffold that makes EI scale.',
      anchor:'left' }
  ];

  data.forEach((d, i) => {
    const v = verts[i];
    const isH = !!d.highlight;
    const g = svg.append('g').attr('class','vertex')
      .on('mouseenter',()=>showTip(`<strong>${d.code} — ${d.name}</strong><br/>${d.tip}`))
      .on('mousemove',moveTip).on('mouseleave',hideTip);
    g.append('circle').attr('cx',v.x).attr('cy',v.y).attr('r',6)
      .attr('fill', isH ? 'var(--color-red)' : 'var(--color-ink)');

    let tx=v.x, ty=v.y, anchor='middle';
    if (d.anchor==='top'){ ty=v.y-32; }
    else if (d.anchor==='right' || d.anchor==='right-bottom'){ tx=v.x+20; anchor='start'; ty=v.y-(d.anchor==='right'?28:-20); }
    else if (d.anchor==='left' || d.anchor==='left-bottom'){ tx=v.x-20; anchor='end'; ty=v.y-(d.anchor==='left'?28:-20); }

    g.append('text').attr('x',tx).attr('y',ty).attr('text-anchor',anchor)
      .attr('class','caps').attr('font-size',12)
      .attr('fill', isH ? 'var(--color-red)' : 'var(--color-ink)').attr('font-weight','bold').text(d.code);

    if (d.anchor==='top'){
      g.append('text').attr('x',tx).attr('y',ty-18).attr('text-anchor',anchor).attr('font-weight','bold').attr('font-size',11).attr('fill', isH ? 'var(--color-red)' : 'var(--color-ink)').text(d.name);
      g.append('text').attr('x',tx).attr('y',ty-34).attr('text-anchor',anchor).attr('font-size',10).attr('font-style','italic').attr('class','secondary').text(d.gloss1 + ' ' + d.gloss2);
    } else {
      g.append('text').attr('x',tx).attr('y',ty+19).attr('text-anchor',anchor).attr('font-weight','bold').attr('font-size',11).attr('fill', isH ? 'var(--color-red)' : 'var(--color-ink)').text(d.name);
      g.append('text').attr('x',tx).attr('y',ty+34).attr('text-anchor',anchor).attr('font-size',10).attr('font-style','italic').attr('class','secondary').text(d.gloss1);
      g.append('text').attr('x',tx).attr('y',ty+48).attr('text-anchor',anchor).attr('font-size',10).attr('font-style','italic').attr('class','secondary').text(d.gloss2);
    }
  });

  svg.append('line').attr('x1',32).attr('y1',500).attr('x2',totalWidth-32).attr('y2',500).attr('stroke','var(--color-border)').attr('stroke-width',0.75).attr('stroke-dasharray','4 3');
  svg.append('text').attr('x',32).attr('y',520).attr('class','secondary').attr('font-size',10).text('PA is highlighted because it was the capacity Seth exercised in the chapter opening — the one that fires before articulation.');
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
