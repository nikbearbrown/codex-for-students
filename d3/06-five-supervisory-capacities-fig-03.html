<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 6.3 — Problem Formulation as a funnel</title>
<style>
:root {
  --color-white: #FFFFFF;
  --color-fill: #F5EFE8;
  --color-ink: #2a1a0e;
  --color-mark: #6B3520;
  --color-red: #C8102E;
  --color-slate: #1A3A5C;
  --color-ochre: #C8860E;
  --color-secondary: #545454;
  --color-border: #D4D4D4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-white: #111111;
    --color-fill: #1a1612;
    --color-ink: #F0EBE3;
    --color-mark: #C8865E;
    --color-red: #E8243A;
    --color-slate: #6B8FB8;
    --color-ochre: #D49A30;
    --color-secondary: #A0978C;
    --color-border: #2E2E2E;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
#chart { width: 100%; min-height: 560px; }
.tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-slate); color: var(--color-white); padding: 8px 12px; font-size: 12px; font-family: 'EB Garamond', Georgia, serif; max-width: 260px; line-height: 1.4; }
text { font-family: 'EB Garamond', Georgia, serif; fill: var(--color-ink); }
.caps { font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; letter-spacing: 0.08em; fill: var(--color-secondary); font-size: 10px; }
.secondary { fill: var(--color-secondary); }
.stage { cursor: pointer; transition: fill 120ms; }
.stage:hover { fill: var(--color-fill); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<div class="tooltip" id="tt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
function draw() {
  d3.select('#chart').selectAll('*').remove();
  const totalWidth = document.getElementById('chart').clientWidth || 700;
  const totalHeight = 540;

  const svg = d3.select('#chart').append('svg').attr('viewBox',`0 0 ${totalWidth} ${totalHeight}`)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  svg.append('marker').attr('id','arrow').attr('markerWidth',8).attr('markerHeight',6).attr('refX',7).attr('refY',3).attr('orient','auto')
    .append('polygon').attr('points','0 0, 8 3, 0 6').attr('fill','var(--color-ink)');
  svg.append('title').attr('id','chart-title').text('Problem Formulation as a funnel');
  svg.append('desc').attr('id','chart-desc').text('Funnel narrowing from vague intent at the top to a well-specified prompt at the bottom. Side annotations name the questions PF asks and the failure modes it excludes.');

  svg.append('text').attr('class','caps').attr('x',32).attr('y',56).text('FIGURE 6.3 — PROBLEM FORMULATION AS A FUNNEL');
  svg.append('text').attr('x',32).attr('y',88).attr('font-weight','bold').attr('font-size',13).text('What PF converts before Codex sees a single prompt');

  const tt = d3.select('#tt');
  function showTip(html){ tt.html(html).style('opacity',1); }
  function moveTip(e){ tt.style('left',(e.pageX+12)+'px').style('top',(e.pageY-8)+'px'); }
  function hideTip(){ tt.style('opacity',0); }

  const cx = totalWidth/2;
  const topY = 130, botY = 440;
  const topHalf = 110, botHalf = 30;

  // Funnel
  svg.append('polygon')
    .attr('points',`${cx-topHalf},${topY} ${cx+topHalf},${topY} ${cx+botHalf},${botY} ${cx-botHalf},${botY}`)
    .attr('fill','var(--color-fill)').attr('stroke','var(--color-border)').attr('stroke-width',1);

  const stages = [
    { y1:130, y2:200, cap:'VAGUE INTENT', sub:'"a feedback notifier"', subStyle:'italic',
      tip:'The sketch in your head — feels complete, isn\'t. The first thing PF makes explicit.' },
    { y1:200, y2:270, cap:'INTERROGATION', sub:'Ask Mode surfaces blind spots',
      tip:'Five Ask Mode questions: what to think about, common failure modes, edge cases, typical shape, minimal version.' },
    { y1:270, y2:340, cap:'SCOPE + INVARIANTS', sub:'touches; never touches',
      tip:'What does it touch (read/write)? What does it never touch? Unstated invariants get quietly violated.' },
    { y1:340, y2:400, cap:'SHAPE + DONE', sub:'where it lives; how to check',
      tip:'File path, function signature, return shape, the testable conditions for done. Spec, not vibes.' },
    { y1:400, y2:440, cap:'WELL-SPECIFIED', sub:'', highlight:true,
      tip:'The collapsed sentence. The prompt Codex sees. Everything above is gone — replaced by one specific statement.' }
  ];

  stages.forEach((s, i) => {
    // approximate polygon clip is implicit; use transparent rect for hover region
    const yMid = (s.y1+s.y2)/2;
    // interpolate funnel width at each y
    function widthAt(y){ const t = (y-topY)/(botY-topY); return topHalf + (botHalf-topHalf)*t; }
    const wTop = widthAt(s.y1), wBot = widthAt(s.y2);
    const g = svg.append('g')
      .on('mouseenter',()=>showTip(`<strong>${s.cap}</strong><br/>${s.tip}`))
      .on('mousemove',moveTip).on('mouseleave',hideTip);
    g.append('polygon').attr('class','stage')
      .attr('points',`${cx-wTop},${s.y1} ${cx+wTop},${s.y1} ${cx+wBot},${s.y2} ${cx-wBot},${s.y2}`)
      .attr('fill','var(--color-fill)').attr('opacity', 0.001).attr('stroke','none');
    if (i < stages.length-1)
      svg.append('line').attr('x1',cx-wBot+6).attr('y1',s.y2).attr('x2',cx+wBot-6).attr('y2',s.y2).attr('stroke','var(--color-border)').attr('stroke-width',0.75).attr('stroke-dasharray','3 2');

    g.append('text').attr('x',cx).attr('y',yMid-4).attr('text-anchor','middle').attr('class','caps')
      .attr('fill', s.highlight ? 'var(--color-red)' : 'var(--color-secondary)').attr('font-weight', s.highlight ? 'bold' : 'normal').text(s.cap);
    if (s.sub){
      g.append('text').attr('x',cx).attr('y',yMid+14).attr('text-anchor','middle').attr('font-size', s.subStyle==='italic' ? 11 : 10).attr('font-style', s.subStyle || 'normal').attr('fill', s.subStyle==='italic' ? 'var(--color-ink)' : 'var(--color-secondary)').text(s.sub);
    }
  });

  // Left annotations
  const lx = 36;
  svg.append('text').attr('x',lx).attr('y',158).attr('class','caps').text('QUESTIONS PF ASKS');
  ['— what does this build do?','— what knowledge does','   it need that isn\'t here?'].forEach((t,i)=>svg.append('text').attr('x',lx).attr('y',186+i*14).attr('font-size',11).text(t));
  ['— what does it touch?','— what does it','   never touch?'].forEach((t,i)=>svg.append('text').attr('x',lx).attr('y',252+i*14).attr('font-size',11).text(t));
  ['— what does done','   look like?'].forEach((t,i)=>svg.append('text').attr('x',lx).attr('y',318+i*14).attr('font-size',11).text(t));

  // Right annotations
  const rx = totalWidth - 210;
  svg.append('text').attr('x',rx).attr('y',158).attr('class','caps').text('WHAT GETS EXCLUDED');
  ['— wrong verb','— unspecified target'].forEach((t,i)=>svg.append('text').attr('x',rx).attr('y',186+i*22).attr('font-size',11).text(t));
  ['— hidden dependencies','— scope creep into','   adjacent files'].forEach((t,i)=>svg.append('text').attr('x',rx).attr('y',252+i*14).attr('font-size',11).text(t));
  ['— "looks good" as a','   handoff condition'].forEach((t,i)=>svg.append('text').attr('x',rx).attr('y',318+i*14).attr('font-size',11).text(t));

  // Arrow to Codex
  svg.append('line').attr('x1',cx).attr('y1',448).attr('x2',cx).attr('y2',478).attr('stroke','var(--color-ink)').attr('stroke-width',1.25).attr('marker-end','url(#arrow)');
  svg.append('text').attr('x',cx).attr('y',500).attr('text-anchor','middle').attr('class','caps').attr('fill','var(--color-ink)').text('→ CODEX SEES THIS');

  svg.append('text').attr('x',32).attr('y',528).attr('class','secondary').attr('font-size',10).text('PF is the most under-exercised of the five. The funnel collapses to a sentence; the sentence is the prompt.');
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
