<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 6.2 — PA fires versus PA dormant</title>
<style>
:root {
  --color-white: #FFFFFF;
  --color-fill: #F5EFE8;
  --color-ink: #2a1a0e;
  --color-mark: #6B3520;
  --color-red: #C8102E;
  --color-slate: #1A3A5C;
  --color-ochre: #C8860E;
  --color-secondary: #545454;
  --color-border: #D4D4D4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-white: #111111;
    --color-fill: #1a1612;
    --color-ink: #F0EBE3;
    --color-mark: #C8865E;
    --color-red: #E8243A;
    --color-slate: #6B8FB8;
    --color-ochre: #D49A30;
    --color-secondary: #A0978C;
    --color-border: #2E2E2E;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
#chart { width: 100%; min-height: 500px; }
.tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-slate); color: var(--color-white); padding: 8px 12px; font-size: 12px; font-family: 'EB Garamond', Georgia, serif; max-width: 260px; line-height: 1.4; }
text { font-family: 'EB Garamond', Georgia, serif; fill: var(--color-ink); }
.caps { font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; letter-spacing: 0.08em; fill: var(--color-secondary); font-size: 10px; }
.secondary { fill: var(--color-secondary); }
.panel { cursor: pointer; transition: fill 120ms; }
.panel:hover { fill: var(--color-fill); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<div class="tooltip" id="tt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
function draw() {
  d3.select('#chart').selectAll('*').remove();
  const totalWidth = document.getElementById('chart').clientWidth || 700;
  const totalHeight = 480;

  const svg = d3.select('#chart').append('svg')
    .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  svg.append('title').attr('id','chart-title').text('PA fires versus PA dormant');
  svg.append('desc').attr('id','chart-desc').text('Two panels comparing the same Codex output with and without Plausibility Auditing engaged.');

  svg.append('text').attr('class','caps').attr('x',32).attr('y',56).text('FIGURE 6.2 — PA FIRES, PA DORMANT');
  svg.append('text').attr('x',32).attr('y',88).attr('font-weight','bold').attr('font-size',13).text("Same fluent output. The supervisor's attention is the only difference.");

  const tt = d3.select('#tt');
  function showTip(html){ tt.html(html).style('opacity',1); }
  function moveTip(e){ tt.style('left',(e.pageX+12)+'px').style('top',(e.pageY-8)+'px'); }
  function hideTip(){ tt.style('opacity',0); }

  const panelW = (totalWidth - 32 - 32 - 24) / 2;

  const panels = [
    { x:32, label:'PANEL A — PA FIRES', stroke:'var(--color-red)', labelColor:'var(--color-red)',
      paLabel:'PA — OFF-FEELING', paLabelColor:'var(--color-red)',
      paLine1:'"the default value is about', paLine2:'to change next sprint"', paStyle:'italic',
      outcomeColor:'var(--color-red)', outcome1:'stop. investigate. fix upstream.', outcome2:'fifteen extra minutes; no Tuesday outage.',
      tip:'The off-feeling registered. Seth stopped before shipping. The feeling preceded the articulation by a minute — the signature of PA.' },
    { x:32+panelW+24, label:'PANEL B — PA DORMANT', stroke:'var(--color-border)', labelColor:'var(--color-secondary)',
      paLabel:'PA — QUIET', paLabelColor:'var(--color-secondary)',
      paLine1:'no off-feeling registered,', paLine2:'or overridden in the rush to ship', paStyle:'italic',
      outcomeColor:'var(--color-ink)', outcome1:'ship. propagate. silently produce', outcome2:'wrong results next Tuesday.',
      tip:'Surface checks pass. PA either did not fire or was overridden by the pressure to ship. The error propagates and surfaces downstream.' }
  ];

  panels.forEach(p => {
    const g = svg.append('g')
      .on('mouseenter',()=>showTip(`<strong>${p.label}</strong><br/>${p.tip}`))
      .on('mousemove',moveTip).on('mouseleave',hideTip);

    g.append('rect').attr('class','panel').attr('x',p.x).attr('y',110).attr('width',panelW).attr('height',270)
      .attr('fill','var(--color-white)').attr('stroke',p.stroke).attr('stroke-width',1);
    g.append('rect').attr('x',p.x).attr('y',110).attr('width',panelW).attr('height',32)
      .attr('fill','var(--color-fill)').attr('stroke',p.stroke).attr('stroke-width',1).attr('pointer-events','none');
    g.append('text').attr('x',p.x+14).attr('y',131).attr('class','caps').attr('font-weight','bold')
      .attr('fill',p.labelColor).text(p.label).attr('pointer-events','none');

    // Codex output sub-box
    g.append('rect').attr('x',p.x+16).attr('y',158).attr('width',panelW-32).attr('height',68)
      .attr('fill','var(--color-fill)').attr('stroke','var(--color-border)').attr('stroke-width',1).attr('pointer-events','none');
    g.append('text').attr('x',p.x+26).attr('y',178).attr('class','caps').text('CODEX OUTPUT').attr('pointer-events','none');
    g.append('text').attr('x',p.x+26).attr('y',196).attr('font-size',11).text('fluent function, tests pass,').attr('pointer-events','none');
    g.append('text').attr('x',p.x+26).attr('y',212).attr('font-size',11).text('surface checks all green').attr('pointer-events','none');

    g.append('text').attr('x',p.x+16).attr('y',252).attr('class','caps').attr('fill',p.paLabelColor).text(p.paLabel).attr('pointer-events','none');
    g.append('text').attr('x',p.x+16).attr('y',270).attr('font-size',11).attr('font-style',p.paStyle).attr('fill', p.label.includes('FIRES') ? 'var(--color-ink)' : 'var(--color-secondary)').text(p.paLine1).attr('pointer-events','none');
    g.append('text').attr('x',p.x+16).attr('y',284).attr('font-size',11).attr('font-style',p.paStyle).attr('fill', p.label.includes('FIRES') ? 'var(--color-ink)' : 'var(--color-secondary)').text(p.paLine2).attr('pointer-events','none');

    g.append('line').attr('x1',p.x+16).attr('y1',312).attr('x2',p.x+panelW-16).attr('y2',312)
      .attr('stroke','var(--color-border)').attr('stroke-width',0.75).attr('stroke-dasharray','4 3').attr('pointer-events','none');
    g.append('text').attr('x',p.x+16).attr('y',332).attr('class','caps').text('OUTCOME').attr('pointer-events','none');
    g.append('text').attr('x',p.x+16).attr('y',350).attr('font-size',11).attr('font-weight','bold').attr('fill',p.outcomeColor).text(p.outcome1).attr('pointer-events','none');
    g.append('text').attr('x',p.x+16).attr('y',366).attr('font-size',11).attr('font-weight','bold').attr('fill',p.outcomeColor).text(p.outcome2).attr('pointer-events','none');
  });

  svg.append('line').attr('x1',32).attr('y1',408).attr('x2',totalWidth-32).attr('y2',408).attr('stroke','var(--color-border)').attr('stroke-width',0.75).attr('stroke-dasharray','4 3');
  svg.append('text').attr('x',32).attr('y',432).attr('class','secondary').attr('font-size',10).text('PA is what fires when fluent output and your knowledge of the situation diverge. The feeling is data —');
  svg.append('text').attr('x',32).attr('y',448).attr('class','secondary').attr('font-size',10).text('attended to in Panel A, overridden in Panel B. The Codex output is identical.');
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
