<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 7.1 — AGENTS.md as persistent session context</title>
<style>
:root {
  --color-white: #FFFFFF;
  --color-fill: #F5EFE8;
  --color-ink: #2a1a0e;
  --color-mark: #6B3520;
  --color-red: #C8102E;
  --color-slate: #1A3A5C;
  --color-ochre: #C8860E;
  --color-secondary: #545454;
  --color-border: #D4D4D4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-white: #111111;
    --color-fill: #1a1612;
    --color-ink: #F0EBE3;
    --color-mark: #C8865E;
    --color-red: #E8243A;
    --color-slate: #6B8FB8;
    --color-ochre: #D49A30;
    --color-secondary: #A0978C;
    --color-border: #2E2E2E;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
#chart { width: 100%; min-height: 500px; }
.tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-slate); color: var(--color-white); padding: 8px 12px; font-size: 12px; font-family: 'EB Garamond', Georgia, serif; max-width: 260px; line-height: 1.4; }
text { font-family: 'EB Garamond', Georgia, serif; fill: var(--color-ink); }
.caps { font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; letter-spacing: 0.08em; fill: var(--color-secondary); font-size: 10px; }
.secondary { fill: var(--color-secondary); }
.node { cursor: pointer; transition: fill 120ms; }
.node:hover { fill: var(--color-fill); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<div class="tooltip" id="tt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
function draw() {
  d3.select('#chart').selectAll('*').remove();
  const totalWidth = document.getElementById('chart').clientWidth || 700;
  const totalHeight = 480;

  const svg = d3.select('#chart').append('svg').attr('viewBox',`0 0 ${totalWidth} ${totalHeight}`)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  svg.append('defs').append('marker').attr('id','arrow').attr('markerWidth',8).attr('markerHeight',6).attr('refX',7).attr('refY',3).attr('orient','auto')
    .append('polygon').attr('points','0 0, 8 3, 0 6').attr('fill','var(--color-ink)');
  svg.append('title').attr('id','chart-title').text('AGENTS.md at the center of every session');
  svg.append('desc').attr('id','chart-desc').text('Central AGENTS.md card with arrows out to three Codex session cards plus a contrast note showing what happens without the file.');

  svg.append('text').attr('class','caps').attr('x',32).attr('y',56).text('FIGURE 7.1 — AGENTS.MD AS PERSISTENT SESSION CONTEXT');
  svg.append('text').attr('x',32).attr('y',88).attr('font-weight','bold').attr('font-size',13).text('One file, loaded at the start of every session, before the first prompt');

  const tt = d3.select('#tt');
  function showTip(html){ tt.html(html).style('opacity',1); }
  function moveTip(e){ tt.style('left',(e.pageX+12)+'px').style('top',(e.pageY-8)+'px'); }
  function hideTip(){ tt.style('opacity',0); }

  const cx = totalWidth/2;

  // Central card
  const cardX = cx-80, cardY=200, cardW=160, cardH=100;
  const central = svg.append('g').attr('class','node')
    .on('mouseenter',()=>showTip('<strong>AGENTS.md</strong><br/>Lives in the project root. Loaded into Codex context automatically before your first prompt every session. Holds stack, style deviations, architecture, environment quirks, and lessons learned.'))
    .on('mousemove',moveTip).on('mouseleave',hideTip);
  central.append('rect').attr('x',cardX).attr('y',cardY).attr('width',cardW).attr('height',cardH)
    .attr('fill','var(--color-fill)').attr('stroke','var(--color-red)').attr('stroke-width',1);
  central.append('text').attr('x',cx).attr('y',cardY+22).attr('text-anchor','middle').attr('class','caps').attr('fill','var(--color-red)').attr('font-weight','bold').text('AGENTS.MD');
  central.append('text').attr('x',cx).attr('y',cardY+44).attr('text-anchor','middle').attr('font-weight','bold').attr('font-size',11).text('project root');
  central.append('text').attr('x',cx).attr('y',cardY+62).attr('text-anchor','middle').attr('font-size',10).attr('font-style','italic').attr('class','secondary').text('stack · style · architecture');
  central.append('text').attr('x',cx).attr('y',cardY+76).attr('text-anchor','middle').attr('font-size',10).attr('font-style','italic').attr('class','secondary').text('environment · lessons learned');
  central.append('text').attr('x',cx).attr('y',cardY+92).attr('text-anchor','middle').attr('class','caps').text('UNDER 200 LINES');

  const sessions = [
    { id:1, x:60, y:120, w:160, h:60, label:'CODEX SESSION 1', title:'Monday — feature work', sub:'prompts run with full context',
      arrowFrom:{x:cardX+10, y:cardY+20}, tip:'Session opens. AGENTS.md is loaded automatically. The first prompt has full project context already.' },
    { id:2, x:totalWidth-180, y:220, w:120, h:60, label:'SESSION 2', title:'Wed — bug hunt', sub:'same conventions',
      arrowFrom:{x:cardX+cardW, y:cardY+50}, tip:'Same conventions apply — no need to re-explain GDScript style, the inventory autoload rule, the never-touch list. AGENTS.md carries them.' },
    { id:3, x:60, y:320, w:160, h:60, label:'CODEX SESSION 3', title:'Fri — refactor pass', sub:'same never-rules',
      arrowFrom:{x:cardX+10, y:cardY+80}, tip:'Refactor pass runs against the same architectural invariants. The never-rules in AGENTS.md prevent reintroducing patterns earlier sessions ruled out.' }
  ];

  sessions.forEach(s => {
    const g = svg.append('g').attr('class','node')
      .on('mouseenter',()=>showTip(`<strong>${s.label}</strong><br/>${s.tip}`))
      .on('mousemove',moveTip).on('mouseleave',hideTip);

    g.append('rect').attr('x',s.x).attr('y',s.y).attr('width',s.w).attr('height',s.h)
      .attr('fill','var(--color-white)').attr('stroke','var(--color-border)').attr('stroke-width',1);
    g.append('rect').attr('x',s.x).attr('y',s.y).attr('width',s.w).attr('height',22)
      .attr('fill','var(--color-fill)').attr('stroke','var(--color-border)').attr('stroke-width',1).attr('pointer-events','none');
    g.append('text').attr('x',s.x+10).attr('y',s.y+15).attr('class','caps').attr('fill','var(--color-ink)').text(s.label).attr('pointer-events','none');
    g.append('text').attr('x',s.x+10).attr('y',s.y+38).attr('font-size',10).text(s.title).attr('pointer-events','none');
    g.append('text').attr('x',s.x+10).attr('y',s.y+52).attr('font-size',10).attr('font-style','italic').attr('class','secondary').text(s.sub).attr('pointer-events','none');

    const tx = s.x + (s.x < cx ? s.w+2 : -8);
    const ty = s.y + s.h/2;
    svg.append('line').attr('x1',s.arrowFrom.x).attr('y1',s.arrowFrom.y).attr('x2',tx).attr('y2',ty)
      .attr('stroke','var(--color-ink)').attr('stroke-width',0.75).attr('marker-end','url(#arrow)');
  });

  // Contrast box
  svg.append('rect').attr('x',totalWidth-280).attr('y',350).attr('width',250).attr('height',60)
    .attr('fill','var(--color-fill)').attr('stroke','var(--color-border)').attr('stroke-width',1).attr('stroke-dasharray','4 3');
  svg.append('text').attr('x',totalWidth-270).attr('y',368).attr('class','caps').text('WITHOUT AGENTS.MD');
  svg.append('text').attr('x',totalWidth-270).attr('y',384).attr('font-size',10).text('each session re-establishes context');
  svg.append('text').attr('x',totalWidth-270).attr('y',398).attr('font-size',10).attr('font-style','italic').attr('class','secondary').text('twelve of thirty minutes lost to repetition');

  // Footer
  svg.append('line').attr('x1',32).attr('y1',430).attr('x2',totalWidth-32).attr('y2',430).attr('stroke','var(--color-border)').attr('stroke-width',0.75).attr('stroke-dasharray','4 3');
  svg.append('text').attr('x',32).attr('y',452).attr('class','secondary').attr('font-size',10).text('Codex reads AGENTS.md automatically — you do not paste it, you do not reference it. The arrows are not requests;');
  svg.append('text').attr('x',32).attr('y',468).attr('class','secondary').attr('font-size',10).text('they are the loading that happens before the first prompt of every session.');
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
