<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 1.1 — Seth's arc from observer to practitioner</title>
<style>
:root {
  --color-white: #FFFFFF;
  --color-fill: #F5EFE8;
  --color-ink: #2a1a0e;
  --color-mark: #6B3520;
  --color-red: #C8102E;
  --color-slate: #1A3A5C;
  --color-ochre: #C8860E;
  --color-secondary: #545454;
  --color-border: #D4D4D4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-white: #111111;
    --color-fill: #1a1612;
    --color-ink: #F0EBE3;
    --color-mark: #C8865E;
    --color-red: #E8243A;
    --color-slate: #6B8FB8;
    --color-ochre: #D49A30;
    --color-secondary: #A0978C;
    --color-border: #2E2E2E;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
#chart { width: 100%; min-height: 380px; }
.tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-slate); color: var(--color-white); padding: 8px 12px; font-size: 12px; font-family: 'EB Garamond', Georgia, serif; max-width: 260px; line-height: 1.4; }
text { font-family: 'EB Garamond', Georgia, serif; fill: var(--color-ink); }
.caps { font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; letter-spacing: 0.08em; fill: var(--color-secondary); font-size: 10px; }
.secondary { fill: var(--color-secondary); }
.node-box { fill: var(--color-fill); stroke: var(--color-border); stroke-width: 1; cursor: pointer; transition: fill 120ms; }
.node-box:hover { fill: var(--color-white); }
.node-circle { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1.5; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<div class="tooltip" id="tt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
function draw() {
  d3.select('#chart').selectAll('*').remove();
  const totalWidth = document.getElementById('chart').clientWidth || 700;
  const totalHeight = 360;
  const margin = { top: 48, right: 32, bottom: 64, left: 32 };
  const chartWidth = totalWidth - margin.left - margin.right;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text("Seth's arc from observer to practitioner");
  svg.append('desc').attr('id', 'chart-desc').text('Two-point timeline showing the move from watching friends borrow capability to building the discipline.');

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  g.append('text').attr('class','caps').attr('y',-24).text("FIGURE 1.1 — SETH'S ARC");
  g.append('text').attr('y',0).attr('font-weight','bold').attr('font-size',13).text('From observer to practitioner');

  const tt = d3.select('#tt');
  function showTip(html){ tt.html(html).style('opacity',1); }
  function moveTip(e){ tt.style('left',(e.pageX+12)+'px').style('top',(e.pageY-8)+'px'); }
  function hideTip(){ tt.style('opacity',0); }

  const nodes = [
    { x: 0.18, label: 'OBSERVER', title: 'Watches friends',
      body: ['Friend aces homework,','freezes on the quiz.'],
      italic: 'The gap surfaces.',
      tip: 'Seth sits across from a friend who pastes the problem set into Codex, accepts the answer, and is already on his phone. Two weeks later the friend freezes on the unassisted quiz.' },
    { x: 0.82, label: 'PRACTITIONER', title: 'Builds the discipline',
      body: ['Ships games. Tests','Codex under real load.'],
      italic: 'The discipline forms.',
      tip: 'Eighteen months later: Bubble Pop on Google Play, Midnight Fuel on Roblox, Haunt & Harvest mid-migration from Unreal to Godot. Codex used on every one. The discipline gets worked out on shipped builds.' }
  ];

  const yAxis = 152;
  g.append('line').attr('x1', chartWidth*0.10).attr('y1', yAxis).attr('x2', chartWidth*0.90).attr('y2', yAxis)
    .attr('stroke','var(--color-ink)').attr('stroke-width',1.5).attr('marker-end','url(#arrow-d3)');

  svg.append('defs').append('marker').attr('id','arrow-d3').attr('markerWidth',8).attr('markerHeight',6)
    .attr('refX',7).attr('refY',3).attr('orient','auto').append('polygon').attr('points','0 0, 8 3, 0 6').attr('fill','var(--color-ink)');

  nodes.forEach((n, i) => {
    const cx = chartWidth * n.x;
    g.append('line').attr('x1', cx).attr('y1', yAxis-6).attr('x2', cx).attr('y2', yAxis+6)
      .attr('stroke','var(--color-ink)').attr('stroke-width',1.5);
    g.append('rect').attr('class','node-box')
      .attr('x', cx-90).attr('y', yAxis-76).attr('width',180).attr('height',56)
      .on('mouseenter',()=>showTip(`<strong>${n.title}</strong><br/>${n.tip}`))
      .on('mousemove',moveTip).on('mouseleave',hideTip);
    g.append('text').attr('class','caps').attr('x', cx).attr('y', yAxis-54).attr('text-anchor','middle').text(n.label);
    g.append('text').attr('x', cx).attr('y', yAxis-34).attr('text-anchor','middle')
      .attr('font-weight','bold').attr('font-size',12).text(n.title);
    g.append('circle').attr('class','node-circle').attr('cx', cx).attr('cy', yAxis).attr('r',8);

    n.body.forEach((line, j) => {
      g.append('text').attr('class','secondary').attr('x', cx).attr('y', yAxis+32+j*14).attr('text-anchor','middle').attr('font-size',11).text(line);
    });
    g.append('text').attr('class','secondary').attr('x', cx).attr('y', yAxis+60).attr('text-anchor','middle').attr('font-size',11).attr('font-style','italic').text(n.italic);
  });

  g.append('line').attr('x1',0).attr('y1',236).attr('x2',chartWidth).attr('y2',236)
    .attr('stroke','var(--color-border)').attr('stroke-width',0.75).attr('stroke-dasharray','4 3');
  g.append('text').attr('class','secondary').attr('y',258).attr('font-size',10)
    .text('Eighteen months separate the two points. The arc is not luck; it is what the rest of the book teaches.');
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
